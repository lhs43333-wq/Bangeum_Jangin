<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방음장인 · 폰 마이크</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f5f1;--ink:#1c1b19;--muted:#6b6a65;--line:#dedcd4;--accent:#1f5fd1;--accent-ink:#fff;--good:#1a7f4b;--bad:#b3261e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--ink:#f0eee8;--muted:#a3a19a;--line:#3a3936;--accent:#7aa7ff;--accent-ink:#0d1b36;--good:#5fd08f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;background:var(--bg);color:var(--ink);
  font:17px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
.brand{font-weight:700;color:var(--muted);font-size:15px}
h1{font-size:26px;line-height:1.3;margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0;color:var(--muted)}
button{font:inherit;font-weight:600;font-size:18px;border:0;border-radius:12px;padding:16px;background:var(--accent);color:var(--accent-ink);margin-top:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);display:inline-block;margin-right:8px;vertical-align:middle}
.ready .dot{background:var(--good)} .rec .dot{background:var(--bad);animation:b 1s infinite} .error .dot{background:var(--bad)}
@keyframes b{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
</style>
</head>
<body>
<div class="brand">방음장인</div>
<h1 id="title"></h1>
<p id="desc"></p>
<button id="go" hidden></button>
<script src="vendor/peerjs.min.js"></script>
<script>
const q = new URLSearchParams(location.search), code = q.get('c') || '';
const lang = (q.get('lang') || navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en';
const TEXT = {
  ko: { start: ['폰을 마이크로 사용합니다', '아래 버튼을 누르고 마이크 사용을 허용해 주세요. 소리는 연결된 컴퓨터로만 전달됩니다.'], btn: '마이크 허용하고 연결',
    connecting: ['컴퓨터에 연결하는 중…', '잠시만 기다려 주세요.'], ready: ['연결됐습니다', '이제 컴퓨터 화면의 안내를 따라 주세요. 이 화면은 켜 둔 채로 폰을 듣는 자리에 놓아 두세요.'],
    rec: ['녹음 중…', '폰을 움직이지 말고 조용히 해 주세요.'], sending: ['결과를 보내는 중…', ''],
    denied: ['마이크를 사용할 수 없습니다', '브라우저 설정에서 마이크를 허용한 뒤 페이지를 새로 고쳐 주세요.'],
    lost: ['연결이 끊겼습니다', '컴퓨터 화면의 QR 코드를 다시 찍어 주세요.'], nocode: ['QR 코드로 열어 주세요', '컴퓨터의 방음장인 화면에 나온 QR 코드를 폰 카메라로 찍으면 연결됩니다.'] },
  en: { start: ['Use this phone as the microphone', 'Tap the button and allow microphone access. Audio is sent only to the connected computer.'], btn: 'Allow microphone and connect',
    connecting: ['Connecting to the computer…', 'One moment.'], ready: ['Connected', 'Now follow the instructions on the computer. Keep this screen on and leave the phone at your listening position.'],
    rec: ['Recording…', 'Keep the phone still and stay quiet.'], sending: ['Sending the result…', ''],
    denied: ['The microphone is not available', 'Allow the microphone in the browser settings, then reload this page.'],
    lost: ['Disconnected', 'Scan the QR code on the computer again.'], nocode: ['Open this page from the QR code', 'Scan the QR code shown by Bangeum Jangin on the computer to connect.'] }
}[lang];
document.documentElement.lang = lang;
const $ = id => document.getElementById(id);
function show(state) {
  document.body.className = { ready: 'ready', rec: 'rec', denied: 'error', lost: 'error' }[state] || '';
  $('title').innerHTML = '<span class="dot"></span>'; $('title').append(TEXT[state][0]); $('desc').textContent = TEXT[state][1];
  $('go').hidden = state !== 'start'; $('go').textContent = TEXT.btn;
}
let ctx, conn, chunks = [], recOn = false, levelOn = false;
function peerOptions() { const p = q.get('peer'); if (!p) return {}; const [host, port] = p.split(':'); return { host, port: Number(port), path: '/', secure: false }; }

async function start() {
  show('connecting');
  let stream, proc = '';
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    const st = stream.getAudioTracks()[0].getSettings ? stream.getAudioTracks()[0].getSettings() : {};
    proc = ['echoCancellation', 'noiseSuppression', 'autoGainControl'].filter(k => st[k] === true).join(', ');
  } catch (e) { return show('denied'); }
  const src = ctx.createMediaStreamSource(stream), node = ctx.createScriptProcessor(4096, 1, 1), mute = ctx.createGain(); mute.gain.value = 0;
  node.onaudioprocess = e => {
    const d = e.inputBuffer.getChannelData(0);
    if (recOn) chunks.push(new Float32Array(d));
    if (levelOn && conn && conn.open) { let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i]; conn.send({ t: 'level', db: 10 * Math.log10(s / d.length + 1e-12) }); }
  };
  src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  const peer = new Peer(peerOptions());
  peer.on('open', () => {
    conn = peer.connect('bangeumjangin-' + code, { reliable: true });
    conn.on('open', () => { conn.send({ t: 'hello', fs: ctx.sampleRate, proc }); show('ready'); });
    conn.on('data', onMessage);
    conn.on('close', () => show('lost'));
  });
  peer.on('error', () => show('lost'));
}
function onMessage(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'level') levelOn = !!m.on;
  else if (m.t === 'rec' && m.on) { chunks = []; recOn = true; conn.send({ t: 'recStart' }); show('rec'); }
  else if (m.t === 'rec' && !m.on) {
    recOn = false; show('sending');
    let n = 0; for (const c of chunks) n += c.length;
    const pcm = new Int16Array(n); let o = 0;
    for (const c of chunks) for (let i = 0; i < c.length; i++) pcm[o++] = Math.max(-32767, Math.min(32767, Math.round(c[i] * 32767)));
    chunks = [];
    conn.send({ t: 'audio', fs: ctx.sampleRate, pcm: pcm.buffer });
    show('ready');
  }
}
$('go').addEventListener('click', start);
show(code ? 'start' : 'nocode');
</script>
</body>
</html>
