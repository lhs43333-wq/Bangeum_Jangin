<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방음장인</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --muted:#6b6a65; --line:#dedcd4;
  --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#e6eefc;
  --good:#1a7f4b; --warn:#a15c00; --bad:#b3261e; --before:#a9a7a0;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161614; --card:#201f1d; --ink:#f0eee8; --muted:#a3a19a; --line:#3a3936;
    --accent:#7aa7ff; --accent-ink:#0d1b36; --accent-soft:#1d2a44;
    --good:#5fd08f; --warn:#f0b35a; --bad:#ff8a80; --before:#77756f; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:820px;margin:0 auto;padding:20px 20px 0}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{max-width:820px;margin:0 auto;padding:16px 20px 60px}
.steps{display:flex;gap:6px;margin:12px 0 20px;padding:0;list-style:none}
.steps li{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps li.done{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.kicker{color:var(--muted);font-size:13px;margin:0 0 4px}
h1{font-size:26px;line-height:1.3;margin:0 0 10px;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 0 14px}
.lead{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;justify-content:space-between}
button.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 20px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn:focus-visible,select:focus-visible,input:focus-visible,.choice:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label.field{display:block;margin:0 0 14px;font-size:14px;color:var(--muted)}
select,input[type=file]{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 14px}
.choice{display:block;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.choice input{position:absolute;opacity:0}
.choice b{display:block}
.choice span{color:var(--muted);font-size:14px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--muted);font-size:14px;margin:0 0 14px}
.note.warn{border-color:var(--warn);color:var(--warn)}
.note.bad{border-color:var(--bad);color:var(--bad)}
.note.good{border-color:var(--good);color:var(--good)}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:6px 0 4px;position:relative}
.meter i{display:block;height:100%;width:0;background:var(--good);transition:width .08s linear}
.meter .zone{position:absolute;top:0;bottom:0;left:50%;width:40%;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.35}
.meterlabel{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
canvas{width:100%;height:300px;display:block;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0 16px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
ul.find{margin:0 0 14px;padding-left:20px}
ul.find li{margin-bottom:4px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 16px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;overflow:auto;max-height:200px}
.progress{font-variant-numeric:tabular-nums;font-size:15px}
svg.pic{width:100%;max-width:520px;height:auto;display:block;margin:6px auto 16px}
.qr{width:220px;max-width:70%;margin:6px auto 14px;background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
a{color:var(--accent);word-break:break-all}
details{margin:0 0 14px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <div class="brand">방음장인<small id="tagline"></small></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ko">한국어</button>
    <button type="button" data-lang="en">English</button>
  </div>
</header>
<main>
  <ol class="steps" id="steps" aria-hidden="true"></ol>
  <section class="card" id="view" aria-live="polite"></section>
</main>

<script src="vendor/qrcode.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script id="dsp">
/* ===== 방음장인 신호처리 코어 (화면과 무관, Node에서도 실행 가능) ===== */
const DSP = (() => {
  function logSweep(f1, f2, dur, fs, amp = 0.5, fade = 0.02) {
    const n = Math.round(dur * fs), x = new Float64Array(n);
    const rate = dur / Math.log(f2 / f1);
    for (let i = 0; i < n; i++) x[i] = amp * Math.sin(2 * Math.PI * f1 * rate * (Math.exp(i / fs / rate) - 1));
    const nf = Math.max(1, Math.floor(fade * fs));
    for (let i = 0; i < nf; i++) { const w = 0.5 * (1 - Math.cos(Math.PI * i / nf)); x[i] *= w; x[n - 1 - i] *= w; }
    return x;
  }
  function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }
  function fft(re, im, inverse) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = (inverse ? 2 : -2) * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < half; k++) {
          const a = i + k, b = a + half;
          const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
          re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
  function padded(x, n) { const o = new Float64Array(n); o.set(x.length > n ? x.subarray(0, n) : x); return o; }
  /* 녹음을 스윕으로 디컨볼루션해 임펄스 응답을 구한다 */
  function impulseResponse(rec, sweep, reg = 1e-6) {
    const n = nextPow2(rec.length + sweep.length);
    const xr = padded(sweep, n), xi = new Float64Array(n), yr = padded(rec, n), yi = new Float64Array(n);
    fft(xr, xi); fft(yr, yi);
    let pmax = 0;
    for (let i = 0; i < n; i++) { const p = xr[i] * xr[i] + xi[i] * xi[i]; if (p > pmax) pmax = p; }
    const eps = reg * pmax;
    for (let i = 0; i < n; i++) {
      const d = xr[i] * xr[i] + xi[i] * xi[i] + eps;
      const hr = (yr[i] * xr[i] + yi[i] * xi[i]) / d, hi = (yi[i] * xr[i] - yr[i] * xi[i]) / d;
      yr[i] = hr; yi[i] = hi;
    }
    fft(yr, yi, true);
    return yr;
  }
  /* 임펄스 응답의 피크 주변을 잘라 주파수 응답(dB)을 구한다 */
  function frequencyResponse(ir, fs, windowS = 0.5, preS = 0.005) {
    let peak = 0, pv = 0;
    for (let i = 0; i < ir.length; i++) { const a = Math.abs(ir[i]); if (a > pv) { pv = a; peak = i; } }
    const pre = Math.floor(preS * fs), len = Math.floor(windowS * fs), total = pre + len;
    const nfft = Math.max(131072, nextPow2(total));
    const re = new Float64Array(nfft), im = new Float64Array(nfft), N = ir.length;
    for (let i = 0; i < total; i++) re[i] = ir[(((peak - pre + i) % N) + N) % N];
    for (let i = 0; i < pre; i++) re[i] *= 0.5 * (1 - Math.cos(Math.PI * i / pre));
    const tail = len >> 1;
    for (let i = 0; i < tail; i++) re[total - tail + i] *= 0.5 * (1 + Math.cos(Math.PI * i / tail));
    fft(re, im);
    const half = nfft / 2 + 1, mag = new Float64Array(half);
    for (let i = 0; i < half; i++) mag[i] = 10 * Math.log10(Math.max(re[i] * re[i] + im[i] * im[i], 1e-24));
    return { df: fs / nfft, magDb: mag, peakIndex: peak, peakValue: pv };
  }
  function logGrid(lo = 20, hi = 20000, ppo = 48) {
    const n = Math.ceil(Math.log2(hi / lo) * ppo) + 1, g = new Float64Array(n);
    for (let i = 0; i < n; i++) g[i] = lo * Math.pow(2, i / ppo);
    return g;
  }
  /* 1/fraction 옥타브 스무딩(파워 평균) + 로그 격자로 옮기기 */
  function smoothToGrid(df, magDb, grid, fraction = 6) {
    const n = magDb.length, csum = new Float64Array(n + 1);
    for (let i = 0; i < n; i++) csum[i + 1] = csum[i] + Math.pow(10, magDb[i] / 10);
    const half = Math.pow(2, 1 / (2 * fraction)), out = new Float64Array(grid.length);
    for (let i = 0; i < grid.length; i++) {
      const a = Math.max(0, Math.ceil(grid[i] / half / df)), b = Math.min(n - 1, Math.floor(grid[i] * half / df));
      let p;
      if (b >= a) p = (csum[b + 1] - csum[a]) / (b - a + 1);
      else {
        const x = grid[i] / df, k = Math.min(n - 2, Math.floor(x)), t = x - k;
        p = Math.pow(10, magDb[k] / 10) * (1 - t) + Math.pow(10, magDb[k + 1] / 10) * t;
      }
      out[i] = 10 * Math.log10(Math.max(p, 1e-24));
    }
    return out;
  }
  /* RBJ 피킹 필터 계수 [b0,b1,b2,a1,a2] */
  function peakCoeffs(fs, fc, gain, q) {
    const A = Math.pow(10, gain / 40), w0 = 2 * Math.PI * fc / fs, al = Math.sin(w0) / (2 * q), c = Math.cos(w0), a0 = 1 + al / A;
    return [(1 + al * A) / a0, -2 * c / a0, (1 - al * A) / a0, -2 * c / a0, (1 - al / A) / a0];
  }
  function highpassCoeffs(fs, fc, q = Math.SQRT1_2) {
    const w0 = 2 * Math.PI * fc / fs, al = Math.sin(w0) / (2 * q), c = Math.cos(w0), a0 = 1 + al;
    return [(1 + c) / 2 / a0, -(1 + c) / a0, (1 + c) / 2 / a0, -2 * c / a0, (1 - al) / a0];
  }
  function lowpassCoeffs(fs, fc, q = Math.SQRT1_2) {
    const w0 = 2 * Math.PI * fc / fs, al = Math.sin(w0) / (2 * q), c = Math.cos(w0), a0 = 1 + al;
    return [(1 - c) / 2 / a0, (1 - c) / a0, (1 - c) / 2 / a0, -2 * c / a0, (1 - al) / a0];
  }
  function coeffDb(k, f, fs) {
    const w = 2 * Math.PI * f / fs, c1 = Math.cos(w), c2 = Math.cos(2 * w);
    const num = k[0] * k[0] + k[1] * k[1] + k[2] * k[2] + 2 * (k[0] * k[1] + k[1] * k[2]) * c1 + 2 * k[0] * k[2] * c2;
    const den = 1 + k[3] * k[3] + k[4] * k[4] + 2 * (k[3] + k[3] * k[4]) * c1 + 2 * k[4] * c2;
    return 10 * Math.log10(Math.max(num / den, 1e-24));
  }
  function eqDb(grid, fs, filters) {
    const out = new Float64Array(grid.length);
    for (const p of filters) { const k = peakCoeffs(fs, p.fc, p.gain, p.q); for (let i = 0; i < grid.length; i++) out[i] += coeffDb(k, grid[i], fs); }
    return out;
  }
  function biquad(x, k) {
    const y = new Float64Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < x.length; i++) { const v = k[0] * x[i] + k[1] * x1 + k[2] * x2 - k[3] * y1 - k[4] * y2; x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v; }
    return y;
  }
  function bandMean(grid, v, lo, hi) { let s = 0, n = 0; for (let i = 0; i < grid.length; i++) if (grid[i] >= lo && grid[i] <= hi) { s += v[i]; n++; } return n ? s / n : 0; }
  /* 스피커가 낼 수 있는 저음 한계 추정: 1옥타브로 크게 평균한 응답이 레벨보다 3 dB 내려가는 곳 */
  function rolloffHz(grid, meas, level, drop = 3, searchHi = 200) {
    const ppo = Math.round(1 / Math.log2(grid[1] / grid[0])), h = ppo >> 1; let f3 = grid[0];
    for (let i = 0; i < grid.length && grid[i] <= searchHi; i++) {
      let s = 0;
      for (let j = i - h; j < i - h + ppo; j++) s += meas[Math.min(grid.length - 1, Math.max(0, j))];
      if (s / ppo < level - drop) f3 = grid[i];
    }
    return f3;
  }
  /* 목표 곡선: 중음역 평균 레벨 + 기울기(취향) + 스피커 저음 한계 따라가기 */
  function targetCurve(grid, meas, tilt = 0, o = {}) {
    const level = bandMean(grid, meas, o.refLo || 200, o.refHi || 2000), f3 = rolloffHz(grid, meas, level, 3, o.searchHi || 200), t = new Float64Array(grid.length);
    for (let i = 0; i < grid.length; i++) t[i] = level + tilt * Math.log2(grid[i] / 1000) - 10 * Math.log10(1 + Math.pow(f3 / grid[i], 4));
    return { target: t, level, rolloff: f3 };
  }
  function solve(A, b) {
    const n = b.length;
    for (let c = 0; c < n; c++) {
      let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
      if (Math.abs(A[c][c]) < 1e-14) continue;
      for (let r = c + 1; r < n; r++) { const m = A[r][c] / A[c][c]; for (let k = c; k < n; k++) A[r][k] -= m * A[c][k]; b[r] -= m * b[c]; }
    }
    const x = new Array(n).fill(0);
    for (let r = n - 1; r >= 0; r--) { let s = b[r]; for (let k = r + 1; k < n; k++) s -= A[r][k] * x[k]; x[r] = Math.abs(A[r][r]) < 1e-14 ? 0 : s / A[r][r]; }
    return x;
  }
  /* 경계 조건이 있는 레벤버그-마쿼트 최소제곱 */
  function leastSquares(resFn, x0, lb, ub, iters = 40) {
    const n = x0.length, clip = v => v.map((a, i) => Math.min(ub[i], Math.max(lb[i], a)));
    let x = clip(x0), r = resFn(x), cost = r.reduce((s, a) => s + a * a, 0), lam = 1e-2;
    for (let it = 0; it < iters; it++) {
      const J = [];
      for (let j = 0; j < n; j++) {
        const h = 1e-4, xp = x.slice(); xp[j] = x[j] + h > ub[j] ? x[j] - h : x[j] + h;
        const rp = resFn(xp), s = xp[j] - x[j], col = new Float64Array(r.length);
        for (let i = 0; i < r.length; i++) col[i] = (rp[i] - r[i]) / s;
        J.push(col);
      }
      const JtJ = [], g = new Array(n);
      for (let a = 0; a < n; a++) {
        JtJ.push(new Array(n)); let s = 0;
        for (let i = 0; i < r.length; i++) s += J[a][i] * r[i];
        g[a] = -s;
        for (let b = 0; b <= a; b++) { let t = 0; for (let i = 0; i < r.length; i++) t += J[a][i] * J[b][i]; JtJ[a][b] = t; JtJ[b][a] = t; }
      }
      let improved = false;
      for (let tries = 0; tries < 8; tries++) {
        const A = JtJ.map((row, a) => row.map((v, b) => a === b ? v * (1 + lam) + 1e-9 : v));
        const d = solve(A, g.slice()), xn = clip(x.map((a, i) => a + d[i])), rn = resFn(xn), cn = rn.reduce((s, a) => s + a * a, 0);
        if (cn < cost) { const rel = (cost - cn) / Math.max(cost, 1e-12); x = xn; r = rn; cost = cn; lam *= 0.3; improved = rel > 1e-7; break; }
        lam *= 5;
      }
      if (!improved) break;
    }
    return x;
  }
  function estimateQ(g, err, idx) {
    const peak = err[idx]; let lo = idx, hi = idx;
    while (lo > 0 && err[lo - 1] * peak > 0 && Math.abs(err[lo - 1]) > Math.abs(peak) / 2) lo--;
    while (hi < err.length - 1 && err[hi + 1] * peak > 0 && Math.abs(err[hi + 1]) > Math.abs(peak) / 2) hi++;
    const bw = Math.max(Math.log2(g[hi] / g[lo]), 0.05), p = Math.pow(2, bw);
    return Math.min(10, Math.max(0.5, Math.sqrt(p) / (p - 1)));
  }
  /* 측정 응답을 목표에 가깝게 만드는 피킹 필터 묶음 찾기 */
  function design(grid, meas, target, fs, opts = {}) {
    const o = Object.assign({ fLo: 40, fHi: 16000, maxFilters: 8, maxBoost: 0, maxCut: -12, stopDb: 1, boostWeight: 0.6, maxBoostQ: 5 }, opts);
    const g = [], base = [];
    for (let i = 0; i < grid.length; i++) if (grid[i] >= o.fLo && grid[i] <= o.fHi) { g.push(grid[i]); base.push(meas[i] - target[i]); }
    const unpack = x => { const f = []; for (let i = 0; i < x.length; i += 3) f.push({ fc: Math.exp(x[i]), gain: x[i + 1], q: Math.exp(x[i + 2]) }); return f; };
    const errOf = fl => { const e = eqDb(g, fs, fl); return base.map((b, i) => b + e[i]); };
    const res = x => errOf(unpack(x)).map(e => e * (e < 0 ? o.boostWeight : 1));
    let filters = [];
    for (let k = 0; k < o.maxFilters; k++) {
      const err = errOf(filters); let idx = 0, best = 0;
      /* 증폭을 허용하지 않으면(maxBoost 0) 꺼진 곳은 건드리지 않는다 */
      for (let i = 0; i < err.length; i++) { const s = Math.abs(err[i]) * (err[i] < 0 ? (o.maxBoost > 0 ? o.boostWeight : 0) : 1); if (s > best) { best = s; idx = i; } }
      if (best < o.stopDb) break;
      filters.push({ fc: g[idx], gain: Math.min(o.maxBoost, Math.max(o.maxCut, -err[idx])), q: estimateQ(g, err, idx) });
      const x0 = [], lb = [], ub = [];
      for (const p of filters) { x0.push(Math.log(p.fc), p.gain, Math.log(p.q)); lb.push(Math.log(o.fLo), o.maxCut, Math.log(0.5)); ub.push(Math.log(o.fHi), o.maxBoost, Math.log(10)); }
      filters = unpack(leastSquares(res, x0, lb, ub));
    }
    filters = filters.filter(p => Math.abs(p.gain) >= 0.5 && !(p.gain > 0 && p.q > o.maxBoostQ)).sort((a, b) => a.fc - b.fc);

    const wide = logGrid(20, 20000, 24);

function limited() { return !S.demo && (S.source === 'phone' || S.mic === 'gen'); }
function phoneView() {
  const P = S.phone;
  if (P.err) return '<p class="note bad">' + t('ph_err', { e: esc(P.err) }) + '</p>';
  if (P.status === 'ok') return '<p class="note good">' + t('ph_ok') + '</p>' + (P.proc ? '<p class="note warn">' + t('s1_proc', { list: esc(P.proc) }) + '</p>' : '') + '<p class="note">' + t('ph_limit') + '</p>';

    (P.status === 'lost' ? '<p class="note bad">' + t('ph_lost') + '</p>' : '') + '<p class="progress">' + t('ph_wait') + '</p>';
}
function bandName(f) { return f < 80 ? 'band_sub' : f < 300 ? 'band_bass' : f < 2000 ? 'band_mid' : f < 6000 ? 'band_himid' : 'band_high'; }

function render() {
  document.documentElement.lang = S.lang;
  $('tagline').textContent = t('tagline');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === S.lang));
  $('steps').innerHTML = VIEWS.map((_, i) => '<li class="' + (i <= S.step ? 'done' : '') + '"></li>').join('');
  $('view').innerHTML = VIEWS[S.step]();
  if (S.step === 5) drawPlot();
}
function go(step) {
  if (S.testing) stopTest();
  stopPreview();
  if (step === 0) { S.demo = false; S.measureMsg = ''; }
  S.step = step; S.applyMsg = S.step === 6 ? S.applyMsg : '';
  render();
  if (step === 6) checkHelper();
  const h = document.querySelector('#view h1'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  window.scrollTo({ top: 0 });
}

  if (b.dataset.go !== undefined) return go(Number(b.dataset.go));
  if (b.dataset.view) { S.view = b.dataset.view; return render(); }
  if (b.dataset.pv) { setPreviewMode(b.dataset.pv); return render(); }
  switch (b.id) {
    case 'start': S.demo = false; if (S.source === 'phone') startPhone(); return go(1);
    case 'demo': S.demo = true; go(4); return measure();
    case 'allow': try { await openMic(); S.permError = false; } catch (err) { S.permError = true; } return render();
    case 'test': S.testing ? stopTest() : startTest(); return render();
    case 'measure': return measure();
    case 'verify': return measure(true);
    case 'pvToggle': if (S.pvPlaying) stopPreview(); else await startPreview(); return render();
    case 'apply': return applyConfig(true);
    case 'toggle': return applyConfig(S.applyState === 'off');
    case 'download': return download();
  }
});
$('view').addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'inSel') { try { await openMic(el.value); } catch (err) { S.permError = true; S.stream = null; } render(); }
  else if (el.id === 'outSel') { S.outId = el.value; try { await S.ctx.setSinkId(el.value); } catch (err) {} setupOutput(); render(); }
  else if (el.name === 'mic') { S.mic = el.value; render(); }
  else if (el.name === 'source') { S.source = el.value; if (S.source === 'phone') { try { await ensureCtx(); } catch (err) {} startPhone(); } render(); }
  else if (el.name === 'taste' || el.name === 'boost') {
    if (el.name === 'taste') S.taste = el.value; else S.boost = el.value === 'fill';
    const playing = S.pvPlaying; computeCorrection(); if (playing) await startPreview(); render();
  }
  else if (el.id === 'xoOn' || el.id === 'xoFc' || el.id === 'xoTrim') {
    if (el.id === 'xoOn') S.xo.on = el.checked; else if (el.id === 'xoFc') S.xo.fc = Number(el.value); else S.xo.trim = Number(el.value);
    const playing = S.pvPlaying; computeCorrection(); if (playing) await startPreview(); render();
  }
  else if (el.id === 'useSub') { S.useSub = el.checked; setupOutput(); render(); }
  else if (el.id === 'pvFile' && el.files[0]) {
    try { await ensureCtx(); S.pvBuf = await S.ctx.decodeAudioData(await el.files[0].arrayBuffer()); S.pvMsg = ''; if (S.pvPlaying) await startPreview(); }
    catch (err) { S.pvBuf = null; S.pvMsg = t('pv_bad'); }
    render();
  }
  else if (el.id === 'calFile' && el.files[0]) {
    try { S.cal = DSP.parseCalibration(await el.files[0].text()); S.calMsg = t('s1_cal_ok', { n: S.cal.f.length }); }
    catch (err) { S.cal = null; S.calMsg = t('s1_cal_bad'); }
    render();
  }
});
window.addEventListener('resize', () => { if (S.step === 5) drawPlot(); });
render();
</script>
